<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>typstbook</title>
    <link rel="icon" href="/typstbook-logo.svg" type="image/svg+xml" />
    <style>
      @layer theme, base, seed-base, components, seed-components, utilities;
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("typstbook-color-mode");
          if (
            stored === "light-only" ||
            stored === "dark-only" ||
            stored === "system"
          ) {
            document.documentElement.dataset.seedColorMode = stored;
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
