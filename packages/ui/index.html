<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>typstbook</title>
    <link rel="icon" href="/typstbook-logo.svg" type="image/svg+xml" />
    <style>
      @layer theme, base, seed-base, components, seed-components, utilities;
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("typstbook-color-mode");
          var mode =
            stored === "light-only" || stored === "dark-only" || stored === "system"
              ? stored
              : "system";
          if (stored === mode) document.documentElement.dataset.seedColorMode = stored;
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme =
            mode === "dark-only" || (mode === "system" && systemDark) ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
